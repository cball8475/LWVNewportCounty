# Fetches the latest LWVUS press releases and commits any changes back
# to the repo. Runs every 6 hours; also triggerable manually from the
# Actions tab.
#
# Requires no secrets — uses the default GITHUB_TOKEN for the commit.

name: Fetch LWVUS News

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours, on the hour (UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit and push updates

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch LWVUS press releases
        run: python scripts/fetch_lwvus.py

      - name: Commit and push if changed
        run: |
          git config user.name "lwvnc-feed-bot"
          git config user.email "lwvnc-feed-bot@users.noreply.github.com"
          # Stage only the files this workflow is allowed to touch.
          git add data/lwvus-news.json 2>/dev/null || true
          # The page file name is configurable; stage any HTML change
          # the script might have made to pages with the news markers.
          git add '*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update LWVUS news feed [skip ci]"
            git push
          fi
