# Fetches the latest LWVUS press releases and commits any changes back
# to the repo. Runs every 6 hours; also triggerable manually from the
# Actions tab.
#
# Requires no secrets — uses the default GITHUB_TOKEN for the commit.

name: Fetch LWVUS News

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours, on the hour (UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab

# All bot workflows that push to main share this group so they queue instead
# of racing — a lost race here silently dropped the loser's update.
concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit and push updates

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch LWVUS press releases
        run: python scripts/fetch_lwvus.py

      - name: Commit and push if changed
        run: |
          git config user.name "lwvnc-feed-bot"
          git config user.email "lwvnc-feed-bot@users.noreply.github.com"
          # Stage exactly the files this workflow owns. No "2>/dev/null || true":
          # that masked a missing output file, and the '*.html' glob could sweep
          # unrelated in-flight edits into a feed commit. Only pages containing
          # the news markers are staged, and only if they exist.
          git add data/lwvus-news.json
          for page in $(grep -l 'LWVUS_NEWS_START' *.html); do
            git add "$page"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update LWVUS news feed [skip ci]"
            # Another bot (events/member-portal/post-news) may push between our
            # checkout and push — rebase and retry instead of silently losing.
            for attempt in 1 2 3 4; do
              if git push; then
                exit 0
              fi
              echo "Push failed (attempt ${attempt}), rebasing and retrying..."
              git pull --rebase origin "${GITHUB_REF_NAME}"
              sleep $((2 ** attempt))
            done
            git push
          fi
