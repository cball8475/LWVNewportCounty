# POKA-YOKE: Verify members.html is StatiCrypt-encrypted on every push
# Fails the build if someone accidentally pushes unencrypted member content
#
# LIMITATION (known, by design): GitHub does not trigger workflows from pushes
# made with GITHUB_TOKEN, so this NEVER fires on the update-member-portal bot's
# commits. The same check runs inline in update-member-portal.yml before its
# commit — this workflow only guards manual human pushes. Keep both.
name: Validate Member Portal Encryption

on:
  push:
    paths:
      - 'members.html'

jobs:
  check-encryption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify members.html is encrypted
        run: |
          # Check for StatiCrypt marker class
          if ! grep -q 'class="staticrypt-html"' members.html; then
            echo "::error::members.html is NOT encrypted! It must be processed through StatiCrypt before pushing."
            echo "Run: staticrypt members-source.html --password YOUR_PASSWORD -o members.html"
            exit 1
          fi

          # Check that raw member content is NOT present (encrypted content is base64 gibberish).
          # The lwvnc-portal-plaintext-sentinel comment is emitted by the builder into the
          # plaintext source specifically so this check can't rot if headings are reworded.
          if grep -qi 'member portal content\|meeting minutes\|board documents\|lwvnc-portal-plaintext-sentinel' members.html; then
            echo "::error::members.html appears to contain unencrypted member content!"
            exit 1
          fi

          echo "✓ members.html is properly encrypted"

      - name: Verify members-source.html is NOT in repo
        run: |
          if [ -f "members-source.html" ]; then
            echo "::error::members-source.html (UNENCRYPTED) was pushed to the repo! Remove it immediately."
            exit 1
          fi
          echo "✓ No unencrypted source file in repo"
