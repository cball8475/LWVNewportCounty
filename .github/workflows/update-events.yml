# Pulls public events from the "LWVNC Public Events" Google Sheet (published CSV)
# twice daily, rebuilds the AUTO-EVENTS block in events.html, and commits if changed.
name: Update Events from Google Sheet

on:
  schedule:
    # 8 AM and 6 PM Eastern (UTC-4 during EDT)
    - cron: '0 12 * * *'   # 8 AM ET
    - cron: '0 22 * * *'   # 6 PM ET
  workflow_dispatch: {}     # Manual trigger for testing

permissions:
  contents: write

# Shares the push queue with the other bot workflows — this and
# update-member-portal fire at the SAME cron times and both push to main;
# without serialization the loser's push silently failed twice a day.
concurrency:
  group: site-content-push
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build events.html from Google Sheet
        run: node scripts/build-events.js events.html

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- events.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected — will commit"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "LWVNC Bot"
          git config user.email "noreply@lwvnewportcounty.org"
          git add events.html
          git commit -m "Auto-update events from Google Sheet"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), rebasing and retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          git push
